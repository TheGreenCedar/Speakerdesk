[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/models",
    "crates/echo",
    "crates/host",
    "xtask",
    "desktop/src-tauri",
    "vendor/mlx-sys",
]
default-members = [
    "crates/core",
    "crates/models",
    "crates/echo",
    "crates/host",
    "xtask",
    "desktop/src-tauri",
]

[patch.crates-io]
mlx-sys = { path = "vendor/mlx-sys" }

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT"
publish = false

[profile.release]
strip = false
codegen-units = 16
