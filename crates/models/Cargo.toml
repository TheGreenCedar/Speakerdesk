[package]
name = "speakerdesk-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mlx-rs model child. Linux builds a protocol stub; Metal runs on macOS."

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
speakerdesk-core = { path = "../core" }
thiserror = "2.0.21"
sha2 = "0.10.9"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "directml", "api-27"] }
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
realfft = "3.5"
rand = "0.9.5"
rand_distr = "0.5.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
mlx-sys = "0.6.0"

# Resolved on macOS agents. Linux CI does not compile these.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.11.0", default-features = false }
mlx-rs = { version = "0.32.0", features = ["metal", "accelerate", "safetensors"] }
safetensors = "0.8.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "block2", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLFeatureType"] }
