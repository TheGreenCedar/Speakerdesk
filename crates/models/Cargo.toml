[package]
name = "speakerdesk-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mlx-rs model child. Linux builds a protocol stub; Metal runs on macOS."

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
speakerdesk-core = { path = "../core" }
thiserror = "2.0.21"
sha2 = "0.10.9"

[dev-dependencies]
hound = "3.5.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
mlx-sys = "0.6.0"

# Resolved on macOS agents. Linux CI does not compile these.
[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { version = "0.32.0", features = ["metal", "accelerate", "safetensors"] }
safetensors = "0.8.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
