[package]
name = "speakerdesk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Speakerdesk domain types, contracts, and product rules"

[dependencies]
base64 = "0.23.1"
fs4 = "1.1.0"
hex = "0.4.3"
hound = "3.5.1"
libc = "0.2.190"
postcard = { version = "1.1.3", features = ["use-std"] }
realfft = "3.5.0"
regex = "1.13.1"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", features = ["wav", "pcm", "aiff", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "mkv", "alac"] }
thiserror = "2.0.21"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4"] }
