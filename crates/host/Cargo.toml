[package]
name = "speakerdesk-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "axum host, supervisors, and the speakerdesk-dev fixture bin"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
fs4 = "1.1.0"
postcard = { version = "1.1.3", features = ["use-std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
speakerdesk-core = { path = "../core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
fixtures = []

[[bin]]
name = "speakerdesk-dev"
path = "src/bin/speakerdesk-dev.rs"
required-features = ["fixtures"]

[[bin]]
name = "inference-fixture"
path = "src/bin/inference-fixture.rs"
required-features = ["fixtures"]

[dev-dependencies]
hound = "3.5.1"
libc = "0.2.190"
tempfile = "3"
