name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speakerdesk-source-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select affected source checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_cache.py changes
      - name: Validate Actions syntax
        run: |
          curl --fail --silent --show-error --location --retry 2 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Test cache boundaries
        run: python -m unittest discover -s tests -p test_ci_cache.py -v
      - name: Validate workflow trust boundaries
        run: |
          python -m pip install pyyaml==6.0.3
          python scripts/check_workflows.py
      - name: Restore source dependencies
        if: steps.changes.outputs.source == 'true'
        id: pip
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: speakerdesk-source-v1-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements-ci.lock.txt') }}
      - if: steps.changes.outputs.source == 'true'
        run: python -m pip install -r requirements-ci.lock.txt
      - run: python scripts/check_source.py
      - if: steps.changes.outputs.source == 'true'
        run: python -m unittest discover -s tests -v
      - if: steps.changes.outputs.source == 'true'
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.source == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.changes.outputs.source == 'true'
        run: node --check speakerdesk/static/app.js && node --check speakerdesk/static/people.js && node --check speakerdesk/static/theme.js
      - name: Save trusted source dependencies
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pip.outputs.cache-hit != 'true' && steps.changes.outputs.source == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip.outputs.cache-primary-key }}
