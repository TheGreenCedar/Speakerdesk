name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache:
        description: Use build caches; disable for an uncached comparison
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: speakerdesk-source-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select affected source checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_cache.py changes
      - name: Validate Actions syntax
        run: |
          curl --fail --silent --show-error --location --retry 2 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Test cache boundaries
        run: python -m unittest discover -s tests -p test_ci_cache.py -v
      - name: Validate workflow trust boundaries
        run: |
          python -m pip install pyyaml==6.0.3
          python scripts/check_workflows.py
      - name: Restore source dependencies
        if: github.event.inputs.cache != 'false' && steps.changes.outputs.source == 'true'
        id: pip
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: speakerdesk-source-v1-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements-ci.lock.txt') }}
      - if: steps.changes.outputs.source == 'true'
        run: python -m pip install -r requirements-ci.lock.txt
      - run: python scripts/check_source.py
      - if: steps.changes.outputs.source == 'true'
        run: python -m unittest discover -s tests -v
      - if: steps.changes.outputs.source == 'true'
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.source == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.changes.outputs.source == 'true'
        run: node --check speakerdesk/static/app.js && node --check speakerdesk/static/live_editor.js && node --check speakerdesk/static/people.js && node --check speakerdesk/static/theme.js
      - if: steps.changes.outputs.source == 'true'
        run: node --test tests/*.test.cjs
      - name: Save trusted source dependencies
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.inputs.cache != 'false' && steps.pip.outputs.cache-hit != 'true' && steps.changes.outputs.source == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip.outputs.cache-primary-key }}
  # Native runtime checks; Python tests cover build tooling and native/JS boundaries.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_CACHE_SIZE: 512M
      SCCACHE_GHA_ENABLED: 'false'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: ${{ github.event.inputs.cache != 'false' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.0
      - name: Install pinned compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: true
      - name: Configure local compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/speakerdesk-sccache" >> "$GITHUB_ENV"
      - name: Capture Rust cache identities
        id: identity
        run: python3 scripts/ci_cache.py rust
      - name: Restore Cargo dependencies and build outputs
        if: github.event.inputs.cache != 'false'
        id: cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ steps.identity.outputs.dependency-key }}
          cache-bin: false
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.event.inputs.cache != 'false' }}
      - name: Restore compiler cache
        if: github.event.inputs.cache != 'false'
        id: compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/speakerdesk-sccache
          key: ${{ steps.identity.outputs.compiler-key }}
          restore-keys: ${{ steps.identity.outputs.compiler-prefix }}
      - name: Report cache hit types
        env:
          CARGO_HIT: ${{ steps.cargo.outputs.cache-hit }}
          COMPILER_MATCHED: ${{ steps.compiler.outputs.cache-matched-key }}
          COMPILER_REQUESTED: ${{ steps.identity.outputs.compiler-key }}
        run: |
          {
            echo "- Cargo dependency/build output exact hit: ${CARGO_HIT:-false}; matched key in action log"
            echo "- Compiler requested: $COMPILER_REQUESTED"
            echo "- Compiler matched: ${COMPILER_MATCHED:-miss}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native crate tests
        run: |
          started=$SECONDS
          cargo test --locked --features speakerdesk-host/fixtures -p speakerdesk-core -p speakerdesk-host -p xtask
          echo "- Native crate tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Finish and report compiler cache
        if: always() && steps.identity.outcome == 'success' && github.event.inputs.cache != 'false'
        run: |
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"
          sccache --stop-server
          cat "$RUNNER_TEMP/sccache-stats.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Check cache byte budget
        id: budget
        run: python3 scripts/ci_cache.py size
      - name: Save trusted compiler cache
        if: success() && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.event.inputs.cache != 'false' && steps.budget.outputs.within-limit == 'true' && steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/speakerdesk-sccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}
  rust-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.0
      # Native model/capture hardware checks remain opt-in; these need no devices or weights.
      - name: Windows host, storage, model and echo contracts
        run: cargo test --locked --features speakerdesk-host/fixtures -p speakerdesk-core -p speakerdesk-host -p speakerdesk-models -p speakerdesk-echo -p xtask
      - name: Windows capture protocol tests
        run: cargo test --locked --manifest-path desktop/capture/windows/Cargo.toml
  rust-macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCCACHE_CACHE_SIZE: 512M
      SCCACHE_GHA_ENABLED: 'false'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: ${{ github.event.inputs.cache != 'false' && 'sccache' || '' }}
      # Keep dependency feature unification identical for the suite and opt-in probes.
      SPEAKERDESK_CI_TEST_PACKAGES: -p speakerdesk-core -p speakerdesk-host -p speakerdesk-models -p speakerdesk-echo -p xtask -p speakerdesk
      TAURI_CONFIG: '{"bundle":{"resources":[],"macOS":{"frameworks":[]}}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.0
      - name: Install pinned compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: true
      - name: Configure local compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/speakerdesk-sccache" >> "$GITHUB_ENV"
      - name: Capture Rust cache identities
        id: identity
        run: python3 scripts/ci_cache.py rust
      - name: Restore Cargo dependencies and build outputs
        if: github.event.inputs.cache != 'false'
        id: cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ steps.identity.outputs.dependency-key }}
          cache-bin: false
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.event.inputs.cache != 'false' }}
      - name: Restore compiler cache
        if: github.event.inputs.cache != 'false'
        id: compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/speakerdesk-sccache
          key: ${{ steps.identity.outputs.compiler-key }}
          restore-keys: ${{ steps.identity.outputs.compiler-prefix }}
      - name: Report cache hit types
        env:
          CARGO_HIT: ${{ steps.cargo.outputs.cache-hit }}
          COMPILER_MATCHED: ${{ steps.compiler.outputs.cache-matched-key }}
          COMPILER_REQUESTED: ${{ steps.identity.outputs.compiler-key }}
        run: |
          {
            echo "- Cargo dependency/build output exact hit: ${CARGO_HIT:-false}; matched key in action log"
            echo "- Compiler requested: $COMPILER_REQUESTED"
            echo "- Compiler matched: ${COMPILER_MATCHED:-miss}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare pinned native MLX runtime
        run: |
          test "$(uname -m)" = arm64
          bash scripts/fetch_mlx_runtime.sh
      - name: Prepare stable vendored native source timestamps
        if: github.event.inputs.cache != 'false'
        env:
          SPEAKERDESK_DEPENDENCY_KEY: ${{ steps.identity.outputs.dependency-key }}
        run: python3 scripts/ci_cache.py prepare-native-source rust
      - name: Test native crates with locked dependencies
        run: |
          started=$SECONDS
          read -r -a packages <<< "$SPEAKERDESK_CI_TEST_PACKAGES"
          cargo test --locked --features speakerdesk-host/fixtures "${packages[@]}"
          echo "- Native and desktop debug tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore exact echo component
        if: github.event.inputs.cache != 'false'
        id: echo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/components/echo
          key: ${{ steps.identity.outputs.echo-key }}
      - name: Build pinned native echo component
        env:
          APPLE_SIGNING_IDENTITY: '-'
          SPEAKERDESK_ECHO_KEY: ${{ github.event.inputs.cache != 'false' && steps.identity.outputs.echo-key || '' }}
        run: python3 scripts/component_cache.py .cache/components/echo "$SPEAKERDESK_ECHO_KEY" desktop/capture/echo/libspeakerdesk_echo.dylib -- python3 scripts/setup_echo.py
      - name: Test native raw capture DSP boundary
        run: |
          read -r -a packages <<< "$SPEAKERDESK_CI_TEST_PACKAGES"
          cargo test --locked --features speakerdesk-host/fixtures "${packages[@]}" raw_dual_capture_opens_and_preserves_partial_pause_tail -- --ignored
          cargo test --locked --features speakerdesk-host/fixtures "${packages[@]}" native_echo_bounds_queues_and_drains_partial_frames_exactly -- --ignored
          cc -dynamiclib -o "$RUNNER_TEMP/speakerdesk-echo-failure.dylib" crates/host/tests/testdata/echo-failure.c
          SPEAKERDESK_ECHO_FAULT_LIBRARY="$RUNNER_TEMP/speakerdesk-echo-failure.dylib" cargo test --locked --features speakerdesk-host/fixtures "${packages[@]}" raw_dual_capture_routes_sources_and_retains_failure_endpoints_on_reopen -- --ignored
      - name: Compile desktop release boundary without packaging resources
        run: |
          started=$SECONDS
          cargo build --release --locked -p speakerdesk
          echo "- Desktop release compilation: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Finish and report compiler cache
        if: always() && steps.identity.outcome == 'success' && github.event.inputs.cache != 'false'
        run: |
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"
          sccache --stop-server
          cat "$RUNNER_TEMP/sccache-stats.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Check cache byte budget
        id: budget
        run: python3 scripts/ci_cache.py size
      - name: Save trusted compiler cache
        if: success() && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.event.inputs.cache != 'false' && steps.budget.outputs.within-limit == 'true' && steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/speakerdesk-sccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - name: Save trusted echo component
        if: success() && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.event.inputs.cache != 'false' && steps.budget.outputs.within-limit == 'true' && steps.echo.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/components/echo
          key: ${{ steps.echo.outputs.cache-primary-key }}
