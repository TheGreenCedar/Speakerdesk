name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install flask==3.1.3 numpy==2.5.3 certifi==2026.7.22 soundfile==0.14.0 cffi==2.1.1 pycparser==3.0
      - run: python scripts/check_source.py
      - run: python -m unittest discover -s tests -v
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --check speakerdesk/static/app.js && node --check speakerdesk/static/people.js && node --check speakerdesk/static/theme.js
