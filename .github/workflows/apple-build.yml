name: Apple package
on:
  workflow_dispatch:
    inputs:
      signing:
        description: Ad-hoc candidate; promote this exact artifact through AppleRelease for notarization
        type: choice
        options: [adhoc]
        default: adhoc
        required: true
permissions:
  contents: read
concurrency:
  group: speakerdesk-apple-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_SIGNING_IDENTITY: '-'
      CI: 'true'
      SPEAKERDESK_PYTHON: '3.13.15'
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      SCCACHE_CACHE_SIZE: 512M
      SCCACHE_GHA_ENABLED: 'false'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Install pinned compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: true
      - name: Configure local compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/speakerdesk-sccache" >> "$GITHUB_ENV"
      - name: Capture cache compatibility and exact component identities
        id: identity
        run: python scripts/ci_cache.py
      - name: Restore uv cache
        id: uv
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/uv
          key: ${{ steps.identity.outputs.uv-key }}
      - name: Restore cargo cache
        id: cargo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.identity.outputs.cargo-key }}
      - name: Restore npm cache
        id: npm
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/npm
          key: ${{ steps.identity.outputs.npm-key }}
      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/speakerdesk-sccache
          key: ${{ steps.identity.outputs.compiler-key }}
          restore-keys: ${{ steps.identity.outputs.compiler-prefix }}
      - name: Restore runtime cache
        id: runtime
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/components/runtime
          key: ${{ steps.identity.outputs.runtime-key }}
      - name: Restore capture cache
        id: capture
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/components/capture
          key: ${{ steps.identity.outputs.capture-key }}
      - name: Report cache hit types
        env:
          UV_HIT: ${{ steps.uv.outputs.cache-hit }}
          CARGO_HIT: ${{ steps.cargo.outputs.cache-hit }}
          NPM_HIT: ${{ steps.npm.outputs.cache-hit }}
          COMPILER_MATCHED: ${{ steps.compiler.outputs.cache-matched-key }}
          COMPILER_REQUESTED: ${{ steps.compiler.outputs.cache-primary-key }}
          RUNTIME_HIT: ${{ steps.runtime.outputs.cache-hit }}
          CAPTURE_HIT: ${{ steps.capture.outputs.cache-hit }}
        run: |
          {
            echo "### Cache restore"
            echo "- uv exact hit: ${UV_HIT:-false}"
            echo "- Cargo dependency exact hit: ${CARGO_HIT:-false}"
            echo "- npm exact hit: ${NPM_HIT:-false}"
            echo "- compiler requested: $COMPILER_REQUESTED"
            echo "- compiler matched: ${COMPILER_MATCHED:-miss}"
            echo "- runtime exact hit: ${RUNTIME_HIT:-false}"
            echo "- capture exact hit: ${CAPTURE_HIT:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build candidate without model weights
        env:
          SPEAKERDESK_RUNTIME_KEY: ${{ steps.identity.outputs.runtime-key }}
          SPEAKERDESK_CAPTURE_KEY: ${{ steps.identity.outputs.capture-key }}
        run: |
          started=$SECONDS
          ./scripts/build_macos.sh
          echo "- Complete candidate build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Finish and report compiler cache
        run: |
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"
          sccache --stop-server
          cat "$RUNNER_TEMP/sccache-stats.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Check cache byte budget
        id: budget
        run: python scripts/ci_cache.py size
      - name: Save trusted uv cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.budget.outputs.within-limit == 'true' && steps.uv.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/uv
          key: ${{ steps.uv.outputs.cache-primary-key }}
      - name: Save trusted cargo cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.budget.outputs.within-limit == 'true' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Save trusted npm cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.budget.outputs.within-limit == 'true' && steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/npm
          key: ${{ steps.npm.outputs.cache-primary-key }}
      - name: Save trusted compiler cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.budget.outputs.within-limit == 'true' && steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/speakerdesk-sccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - name: Save trusted runtime cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.budget.outputs.within-limit == 'true' && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/components/runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Save trusted capture cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.budget.outputs.within-limit == 'true' && steps.capture.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/components/capture
          key: ${{ steps.capture.outputs.cache-primary-key }}
      - name: Produce exact-source artifact manifest
        run: python scripts/artifact_manifest.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Speakerdesk-${{ github.sha }}-adhoc
          path: release/*
          retention-days: 14
          if-no-files-found: error
