# Exclusive write sets. `cargo xtask ownership --check` rejects overlaps.

[[agent]]
id = "coordinator"
paths = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "clippy.toml",
  ".cargo/config.toml",
  ".gitignore",
  "AGENTS.md",
  "GLOSSARY.md",
  "docs/adr/**",
  "docs/rust-port/**",
  "xtask/Cargo.toml",
  "xtask/src/main.rs",
  "xtask/src/commands/mod.rs",
  "xtask/src/commands/ownership.rs",
  "xtask/src/commands/pending.rs",
  "xtask/src/commands/probe.rs",
  "crates/core/Cargo.toml",
  "crates/core/src/lib.rs",
  "crates/core/src/ids.rs",
  "crates/core/src/error.rs",
  "crates/core/src/messages.rs",
  "crates/core/src/security.rs",
  "crates/core/src/document.rs",
  "crates/core/src/models.rs",
  "crates/core/src/ipc.rs",
  "crates/core/src/languages.rs",
  "crates/core/src/limits.rs",
  "crates/core/src/timing_policy.rs",
  "crates/models/Cargo.toml",
  "crates/models/src/lib.rs",
  "crates/models/src/dispatch.rs",
  "crates/models/src/serve.rs",
  "crates/models/src/memory.rs",
  "crates/models/src/metallib.rs",
  "crates/echo/Cargo.toml",
  "crates/host/Cargo.toml",
  "crates/host/src/lib.rs",
  "desktop/src-tauri/Cargo.toml",
]

[[agent]]
id = "oracle"
paths = ["tools/oracle/**", "tests/goldens/**"]

[[agent]]
id = "core-text"
paths = [
  "crates/core/src/transcript.rs",
  "crates/core/src/edit.rs",
  "crates/core/src/review.rs",
  "crates/core/src/export.rs",
]

[[agent]]
id = "core-speech"
paths = [
  "crates/core/src/speech.rs",
  "crates/core/src/language.rs",
  "crates/core/src/memo.rs",
]

[[agent]]
id = "core-timing"
paths = ["crates/core/src/timing.rs", "crates/core/src/alignment.rs"]

[[agent]]
id = "core-audio"
paths = ["crates/core/src/audio.rs"]

[[agent]]
id = "core-store"
paths = ["crates/core/src/store/**"]

[[agent]]
id = "import"
paths = ["crates/core/src/import.rs"]

[[agent]]
id = "live-engine"
paths = ["crates/core/src/live.rs"]

[[agent]]
id = "people-voice"
paths = ["crates/core/src/people.rs", "crates/core/src/voice.rs"]

[[agent]]
id = "model-silero"
paths = ["crates/models/src/silero/**"]

[[agent]]
id = "model-whisper"
paths = ["crates/models/src/whisper_lid/**"]

[[agent]]
id = "model-sortformer"
paths = ["crates/models/src/sortformer/**"]

[[agent]]
id = "model-cohere"
paths = ["crates/models/src/cohere/**"]

[[agent]]
id = "model-ctc"
paths = ["crates/models/src/ctc/**"]

[[agent]]
id = "model-redimnet"
paths = ["crates/models/src/redimnet/**"]

[[agent]]
id = "echo"
paths = ["crates/echo/src/**", "desktop/capture/echo/**"]

[[agent]]
id = "host-inference"
paths = ["crates/host/src/inference.rs"]

[[agent]]
id = "host-setup"
paths = ["crates/host/src/setup.rs"]

[[agent]]
id = "host-jobs"
paths = [
  "crates/host/src/http.rs",
  "crates/host/src/worker.rs",
  "crates/host/src/routes.rs",
]

[[agent]]
id = "capture"
paths = ["crates/host/src/capture.rs"]

[[agent]]
id = "host-meeting"
paths = ["crates/host/src/meeting.rs"]

[[agent]]
id = "host-people"
paths = ["crates/host/src/people_routes.rs"]

[[agent]]
id = "vertical-slice"
paths = ["desktop/src-tauri/src/main.rs"]

[[agent]]
id = "admission"
paths = [
  "crates/host/src/admission.rs",
  "desktop/src-tauri/src/updates.rs",
  "desktop/src-tauri/src/update_control.rs",
]

[[agent]]
id = "fixtures"
paths = ["crates/host/src/bin/**"]

[[agent]]
id = "fake-capture"
paths = ["xtask/src/commands/fake_capture.rs"]

[[agent]]
id = "packaging"
paths = [
  "scripts/**",
  ".github/**",
  "frontend/**",
  "README.md",
  "desktop/package.json",
  "desktop/src-tauri/tauri.conf.json",
]
