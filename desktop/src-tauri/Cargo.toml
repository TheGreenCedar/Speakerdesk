[package]
name = "speakerdesk"
version = "0.7.8"
edition = "2021"
license.workspace = true
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Official upstream macOS atomic replacement and previous-bundle recovery fix.
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "65ce65bdbb4390f73076c8182fbf06a52036f241" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
libc = "0.2"
speakerdesk-host = { path = "../../crates/host" }
speakerdesk-models = { path = "../../crates/models" }
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }
