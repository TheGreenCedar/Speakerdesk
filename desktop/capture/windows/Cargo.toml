[package]
name = "speakerdesk-capture-windows"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "speakerdesk-capture"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.153"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Variant"] }
