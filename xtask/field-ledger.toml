# M1.2 product-field ledger — one row per distinct key path the v0.6.6 Python
# code writes into persisted payloads (jobs/job_metadata/job_progress payloads,
# people, voice_profiles, preferences).
#
# `class` is the ruled classification.
#   product = read by frontend JS, exports, edit/merge rules, refinement
#             reconciliation, voice eligibility, or recovery.
#   private = engine-only recovery/refinement state the user never sees
#             (mirrors job_store.PRIVATE_FIELDS plus row-internal state).
#   drop    = receipts/qualification (D6), no-reader fields, and D11
#             dropped-path fields. Not migrated; not in Rust types.
#
# Writers/readers cite file:line in the v0.6.6 tree (speakerdesk/ == working tree).
# Line numbers are from the v0.6.6 worktree (.cache/v066).
# `in_fixtures` = key path observed in tests/goldens/legacy-db/*.sqlite.
# `{}` = dynamic map key (utterance id, track id, hex id); `[]` = array element.

# ============================ scope: job ============================

